name: Vercel Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-deploy-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Vercel CLI
        run: npm install -g vercel@^28 || true

      - name: Deploy to Vercel
        id: vercel_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # Run vercel and capture output to a file for parsing
          vercel --token "${VERCEL_TOKEN}" --prod --confirm 2>&1 | tee vercel-output.txt

      - name: Extract production URL
        id: extract_url
        run: |
          set -euo pipefail
          mkdir -p docs
          # Use the repo script to extract the URL from the captured output and write to docs/production_url.txt
          ./.github/scripts/extract_vercel_url.sh vercel-output.txt > docs/production_url.txt
          echo "url=$(cat docs/production_url.txt)" >> $GITHUB_OUTPUT

      - name: Commit production URL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add the file and commit only if it changed
          git add docs/production_url.txt || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update production deployment URL to ${{ steps.extract_url.outputs.url }}"
            git push
            echo "Committed and pushed production URL update"
          fi